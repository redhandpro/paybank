<div class="form-options">
                <label>
                    <input type="checkbox" checked />
                    مرا به خاطر بسپار
                </label>
                <a href="#">رمز عبور را فراموش کردید؟</a>
            </div>

            <button type="submit" class="btn-submit">
                <span>ورود</span>
                <i class="fas fa-arrow-left"></i>
            </button>
        </form>

        <div class="login-footer">
            حساب کاربری ندارید؟ <a href="#">ثبت نام کنید</a>
        </div>
    </div>

    <script>
        // نمایش/مخفی کردن رمز
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // ارسال فرم
        const form = document.getElementById('loginForm');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                const card = document.querySelector('.login-card');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 500);

                const btn = this.querySelector('.btn-submit');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span>لطفاً همه فیلدها را پر کنید</span>';
                btn.style.background = 'linear-gradient(135deg, #f97373, #f55555)';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                }, 1800);
                return;
            }

            //  ذخیره‌سازی اطلاعات در localStorage 
            // (برای امنیت بیشتر، رمز رو با btoa encode می‌کنیم)
            const encodedPassword = btoa(password); // base64 encode
            localStorage.setItem('userEmail', username);
            localStorage.setItem('userPassword', encodedPassword);

            // ادامه روند ورود و هدایت
            const btn = this.querySelector('.btn-submit');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span><i class="fas fa-spinner fa-spin"></i> در حال ورود...</span>';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<span><i class="fas fa-check-circle"></i> موفق!</span>';
                btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            }, 1500);
        });

        document.querySelector('.login-card').addEventListener('animationend', function() {
            this.classList.remove('shake');
        });
    </script>

</body>
</html>
