<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>سوالات عاشقانه</title>
    <!-- لینک فونت وزیر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container" id="app">
        <!-- هدر -->
        <header class="header">
            <h1>💖 سوالات ویژه</h1>
            <p>این سوالات مال توست، با دقت جواب بده 😉</p>
        </header>

        <!-- بخش اصلی: سوال و گزینه‌ها -->
        <main class="quiz-box" id="quizBox">
            <!-- توسط JS پر می‌شود -->
        </main>

        <!-- بخش نتیجه (پایان) -->
        <div class="result-box hidden" id="resultBox">
            <div class="result-content">
                <h2>🌹 ممنون از جوابات!</h2>
                <p>جواب‌های قشنگت رو گرفتم:</p>
                <ul id="answersList"></ul>
                <div class="contact-card">
                    <span class="label">📞 شماره من:</span>
                    <span class="phone-number" id="myPhone">۰۹۱۲ ۳۴۵ ۶۷۸۹</span>
                    <p class="hint">هر وقت خواستی باهام حرف بزنی، زنگ بزن ❤️</p>
                </div>
                <button class="btn-restart" onclick="restartQuiz()">🔄 دوباره امتحان کن</button>
            </div>
        </div>

        <!-- دکمه‌های ناوبری (در صورت نیاز) -->
        <div class="nav-buttons" id="navButtons">
            <button class="btn-next hidden" id="nextBtn" onclick="nextQuestion()">بعدی ➜</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
