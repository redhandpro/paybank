<!-- Form -->
        <form class="login-form" id="loginForm" novalidate>
            <!-- Email / Phone -->
            <div class="input-group">
                <input type="text" id="username" placeholder="ایمیل یا شماره موبایل" required autocomplete="username" />
                <span class="icon"><i class="fas fa-user"></i></span>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input type="password" id="password" placeholder="رمز عبور" required autocomplete="current-password" />
                <span class="icon"><i class="fas fa-lock"></i></span>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="نمایش رمز عبور">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <!-- Options -->
            <div class="form-options">
                <label>
                    <input type="checkbox" checked />
                    مرا به خاطر بسپار
                </label>
                <a href="#">رمز عبور را فراموش کردید؟</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                ورود
            </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            کاربر جدید هستید؟ <a href="#">ثبت‌نام کنید</a>
        </div>
    </div>

    <script>
        // ---------- Toggle Password ----------
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // ---------- Form Submission (Demo) ----------
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const container = document.getElementById('loginContainer');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Simple validation
            if (!username || !password) {
                // Shake the container
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 400);

                // Button error feedback
                submitBtn.classList.add('error');
                submitBtn.textContent = 'لطفاً همه فیلدها را پر کنید';
                setTimeout(() => {
                    submitBtn.classList.remove('error');
                    submitBtn.textContent = 'ورود';
                }, 2000);
                return;
            }

            // Simulate login process
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'در حال ورود...';

            // Save to localStorage (demo)
            localStorage.setItem('userEmail', username);

            setTimeout(() => {
                // Success
                submitBtn.classList.remove('loading');
                submitBtn.classList.add('success');
                submitBtn.textContent = '✅ موفق!';

                // Redirect to dashboard (or any page)
                setTimeout(() => {
                    // برای نمایش ساده، به یک صفحه ساختگی هدایت می‌کنیم
                    // می‌توانید آدرس را به دلخواه تغییر دهید
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 1500);
        });

        // ---------- Remove shake after animation ----------
        container.addEventListener('animationend', function() {
            this.classList.remove('shake');
        });
    </script>
    </body>
</html>
