<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>داشبورد</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazir', sans-serif;
            background: #f0f0f1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem 2.8rem;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            text-align: center;
        }
        .card .avatar {
            background: #ef4056;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2.2rem;
            color: #fff;
        }
        .card h2 {
            color: #23262a;
            font-weight: 700;
        }
        .card .sub {
            color: #81858b;
            margin-bottom: 1.5rem;
        }
        .info {
            background: #f8f8fa;
            border-radius: 16px;
            padding: 1rem 1.5rem;
            text-align: right;
            margin: 1rem 0;
        }
        .info .row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e0e0e2;
        }
        .info .row:last-child {
            border-bottom: none;
        }
        .info .label {
            color: #81858b;
        }
        .info .value {
            color: #23262a;
            font-weight: 500;
        }
        .btn {
            background: #ef4056;
            border: none;
            border-radius: 12px;
            padding: 0.8rem 2rem;
            color: #fff;
            font-family: 'Vazir', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }
        .btn:hover {
            background: #d53a4c;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #e0e0e2;
            color: #515559;
            margin-right: 0.5rem;
        }
        .btn-outline:hover {
            background: #f0f0f1;
            border-color: #b0b4b9;
        }
        a {
            color: #ef4056;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <h2>داشبورد</h2>
        <p class="sub">خوش آمدید!</p>

        <div class="info">
            <div class="row">
                <span class="label">ایمیل / موبایل</span>
                <span class="value" id="displayEmail">—</span>
            </div>
            <div class="row">
                <span class="label">وضعیت</span>
                <span class="value" style="color:#2ecc71;">فعال</span>
            </div>
        </div>

        <div>
            <button class="btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</button>
            <a href="index.html" style="display:inline-block; margin-top: 0.8rem; font-size:0.9rem;">↩ بازگشت به ورود</a>
        </div>
    </div>

    <script>
        // نمایش ایمیل ذخیره شده
        const email = localStorage.getItem('userEmail');
        document.getElementById('displayEmail').textContent = email || 'مهمان';
                // خروج
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('userEmail');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
