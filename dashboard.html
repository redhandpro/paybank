<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>داشبورد</title>
    <style>
        body {
            font-family: 'Vazir', sans-serif;
            background: #0b0e1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .box {
            background: rgba(255,255,255,0.05);
            padding: 3rem 4rem;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        h1 { color: #a855f7; }
        a { color: #6c3bfa; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 به داشبورد خوش آمدید!</h1>
        <p>شما با موفقیت وارد شدید.</p>
        <br>
        <a href="index.html">↩ بازگشت به صفحه ورود</a>
    </div>
</body>
</html>
