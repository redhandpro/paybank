font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <div class="avatar">
            <i class="fas fa-user"></i>
        </div>
        <h1>داشبورد</h1>
        <p class="sub">به پنل کاربری خود خوش آمدید</p>

        <div class="info-box" id="userInfo">
            <div class="item">
                <span class="label"><i class="fas fa-envelope"></i> ایمیل</span>
                <span class="value" id="displayEmail">—</span>
            </div>
            <div class="item">
                <span class="label"><i class="fas fa-lock"></i> رمز عبور</span>
                <span class="value" id="displayPassword">—</span>
            </div>
        </div>

        <button class="btn-logout" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> خروج
        </button>
        <br />
        <a href="index.html" class="btn-back">↩ بازگشت به صفحه ورود</a>
        <div class="note">* رمز به صورت رمزنگاری شده‌ی ساده (base64) ذخیره شده است.</div>
    </div>

    <script>
        // دریافت اطلاعات از localStorage
        const email = localStorage.getItem('userEmail');
        const encodedPass = localStorage.getItem('userPassword');

        // نمایش در المان‌ها
        document.getElementById('displayEmail').textContent = email || 'مهمان';

        if (encodedPass) {
            // دیکد کردن رمز (برای نمایش)
            try {
                const decoded = atob(encodedPass);
                document.getElementById('displayPassword').textContent = decoded;
            } catch {
                document.getElementById('displayPassword').textContent = 'خطا در رمزگشایی';
            }
        } else {
            document.getElementById('displayPassword').textContent = '—';
        }

        // دکمه خروج: پاک کردن اطلاعات و برگشت به لاگین
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userPassword');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
